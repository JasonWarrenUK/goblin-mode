id: ts-bare-status-field
language: TypeScript
severity: error
message: status field typed as bare string; use a string-literal union or discriminated union
rule:
  any:
    - kind: property_signature
    - kind: public_field_definition
  all:
    - has:
        field: name
        regex: '^(status|state)$|[a-z0-9](Status|State)$'
    - has:
        field: type
        has:
          kind: predefined_type
          regex: '^string$'
