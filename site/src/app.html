<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- No icon yet; an empty one stops the browser asking for /favicon.ico. -->
		<link rel="icon" href="data:," />
		<script>
			// Apply a stored theme choice before first paint so a dark choice never flashes light.
			try {
				const choice = localStorage.getItem('goblin-theme');
				if (choice === 'light' || choice === 'dark') document.documentElement.dataset.theme = choice;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
