# Builds the Goblin Mode site in site/ and deploys it to GitHub Pages.
#
# The site generates its counts and install commands from the plugins and skills
# at build time, so it redeploys whenever any of those change (decision 18), not
# only when site/ does. Pull requests touching the same paths get the build and
# the tests without the deploy.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'marketplace/**'
      - '.claude-plugin/**'
      - 'skills/**'
      - 'site/**'
      - '.claude/themes/**'
      - 'library/scripts/theme/**'
      # quoted on the Metadata page, and its test checks the quote line for line
      - 'library/scripts/skill-lint.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'marketplace/**'
      - '.claude-plugin/**'
      - 'skills/**'
      - 'site/**'
      - '.claude/themes/**'
      - 'library/scripts/theme/**'
      # quoted on the Metadata page, and its test checks the quote line for line
      - 'library/scripts/skill-lint.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer run on a pull request replaces the older one; on main every run finishes, so a
# deploy already under way is never cut off by the next push.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BASE_PATH: /goblin-mode

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      # Each action is pinned to a commit, with the release it was in beside it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      # `test` builds the site first, then checks every page and link in build/.
      - run: bun run test
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
